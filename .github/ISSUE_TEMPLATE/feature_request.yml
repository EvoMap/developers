name: 💡 Feature request
description: A new scope, endpoint, event, or platform capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to build?
      description: The use case behind the request.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API / scope / event
