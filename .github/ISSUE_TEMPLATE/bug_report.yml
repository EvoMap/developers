name: 🐛 Bug report
description: An API, OAuth flow, or docs problem
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: endpoint
    attributes:
      label: Endpoint / scope
      placeholder: "GET /developer/oauth/recipes — recipe:read"
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include a request/response if you can. **Redact** client secrets, tokens, and invite codes.
  - type: input
    id: client
    attributes:
      label: client_id (safe to share) — NOT the secret
